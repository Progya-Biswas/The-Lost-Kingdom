name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Linux graphics build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxinerama-dev libxcursor-dev
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build graphical and command-line games
        run: cmake --build build --parallel
      - name: Run C command parser tests
        run: ctest --test-dir build --output-on-failure

  build-windows:
    name: Windows graphical build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build graphical and command-line games
        run: cmake --build build --config Release --parallel
      - name: Run C command parser tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: The-Lost-Kingdom-Windows
          path: |
            build/Release/lost_kingdom.exe
            build/Release/lost_kingdom_cli.exe
          if-no-files-found: error
